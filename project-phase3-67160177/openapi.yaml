  # ==========================================
  # Notification Service (microservice พอร์ต 3001)
  # ==========================================

  /health:
    servers:
      - url: http://localhost:3001
        description: Notification Service
    get:
      tags: [Notification Service]
      summary: ตรวจสอบสถานะ Notification Service
      operationId: getNotificationServiceHealth
      responses:
        "200":
          description: service ทำงานอยู่
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: notification-service
                  discordConfigured:
                    type: boolean
                    description: ตั้งค่า `DISCORD_WEBHOOK_URL` แล้วหรือไม่
                    example: true

  /notifications:
    servers:
      - url: http://localhost:3001
        description: Notification Service
    get:
      tags: [Notification Service]
      summary: ดึงประวัติการแจ้งเตือน (เก็บในหน่วยความจำ)
      operationId: getNotificationHistory
      responses:
        "200":
          description: สำเร็จ (ใหม่สุดอยู่ก่อน สูงสุด 50 รายการ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationRecord"
    post:
      tags: [Notification Service]
      summary: ส่งแจ้งเตือนบอร์ดเกมใหม่ไปที่ Discord
      operationId: sendNotification
      description: |
        API หลักเรียก endpoint นี้หลังเพิ่มบอร์ดเกมสำเร็จ service จะส่งข้อความไป Discord **1 ครั้ง**
        พร้อม timeout (`DISCORD_TIMEOUT_MS` ค่าเริ่มต้น 1500 ms)

        - ส่งสำเร็จ: 200 `sent = true`
        - ไม่ได้ตั้งค่า webhook: 200 `sent = false` (ไม่ใช่ความผิดพลาดชั่วคราว ผู้เรียกไม่ต้อง retry)
        - Discord ล้มเหลว/ติดต่อไม่ได้: 502 / Discord ตอบช้าเกิน timeout: 504
          (เป็น 5xx เพื่อให้ API หลัก retry ตามกลไกใน `src/services/external-api.js`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
      responses:
        "200":
          description: ประมวลผลแล้ว (ดูผลที่ `data.sent`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ส่งแจ้งเตือนไปที่ Discord แล้ว
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      sent:
                        type: boolean
                        example: true
              examples:
                sent:
                  summary: ส่งสำเร็จ
                  value:
                    message: ส่งแจ้งเตือนไปที่ Discord แล้ว
                    data: { id: 1, sent: true }
                skipped:
                  summary: ไม่ได้ตั้งค่า webhook
                  value:
                    message: ไม่ได้ตั้งค่า Discord Webhook จึงไม่ได้ส่งแจ้งเตือน
                    data: { id: 2, sent: false }
        "400":
          description: ข้อมูลคำขอไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidType:
                  summary: type ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_NOTIFICATION
                      message: type ต้องเป็น "boardgame.created"
                invalidBoardgame:
                  summary: ข้อมูลบอร์ดเกมไม่ครบ
                  value:
                    error:
                      code: INVALID_NOTIFICATION
                      message: boardgame ต้องมี name (ข้อความ), minPlayers และ maxPlayers (จำนวนเต็ม)
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "502":
          description: Discord ตอบผิดพลาดหรือติดต่อไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: DISCORD_ERROR
                  message: Discord ตอบ HTTP 503
        "504":
          description: Discord ไม่ตอบภายในเวลาที่กำหนด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: DISCORD_TIMEOUT
                  message: Discord ไม่ตอบภายใน 1500 ms

components:
  parameters:
    BoardgameId:
      name: id
      in: path
      required: true
      description: ID ของบอร์ดเกม (จำนวนเต็มบวก)
      schema:
        type: integer
        minimum: 1
        example: 1
    CategoryId:
      name: id
      in: path
      required: true
      description: ID ของหมวดหมู่ (จำนวนเต็มบวก)
      schema:
        type: integer
        minimum: 1
        example: 1

  examples:
    MalformedJson:
      summary: JSON ใน body ผิดรูปแบบ
      value:
        error:
          code: entity.parse.failed
          message: Expected double-quoted property name in JSON at position 20 (line 3 column 1)

  schemas:
    Boardgame:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Catan
        minPlayers:
          type: integer
          example: 3
        maxPlayers:
          type: integer
          example: 4
        categories:
          type: string
          nullable: true
          description: ชื่อหมวดหมู่คั่นด้วยจุลภาค เป็น `null` ถ้าเกมยังไม่มีหมวดหมู่
          example: Strategy,Party Game

    BoardgameBase:
      type: object
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: Carcassonne
        minPlayers:
          type: integer
          example: 2
        maxPlayers:
          type: integer
          example: 5

    BoardgameInput:
      type: object
      required: [name, minPlayers, maxPlayers]
      properties:
        name:
          type: string
          maxLength: 100
          description: ชื่อบอร์ดเกม (ห้ามซ้ำกับที่มีอยู่)
          example: Carcassonne
        minPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 2
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: ต้องมากกว่าหรือเท่ากับ `minPlayers`
          example: 5

    BoardgamePatchInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          example: Carcassonne Deluxe
        minPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 2
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 6

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Strategy

    CategoryWithCount:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            boardgameCount:
              type: integer
              description: จำนวนบอร์ดเกมในหมวดหมู่นี้
              example: 2

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: ชื่อหมวดหมู่ (ห้ามซ้ำกับที่มีอยู่)
          example: Co-op

    CategoryLinkInput:
      type: object
      required: [category_id]
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 2

    Notification:
      type: object
      description: ผลการส่งแจ้งเตือนไปยัง API ภายนอก (Discord Webhook)
      properties:
        sent:
          type: boolean
          description: ส่งแจ้งเตือนสำเร็จหรือไม่
          example: true
        attempts:
          type: integer
          description: จำนวนครั้งที่เรียก API ภายนอก (ครั้งแรก + retry)
          example: 1
        message:
          type: string
          example: ส่งแจ้งเตือนไปที่ Discord แล้ว

    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        services:
          type: object
          properties:
            api:
              type: string
              enum: [up]
            database:
              type: string
              enum: [up, down]
            notificationService:
              type: string
              enum: [up, down]

    NotificationRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          example: boardgame.created
        message:
          type: string
          example: "🎲 เพิ่มบอร์ดเกมใหม่: Carcassonne (2-5 ผู้เล่น)"
        status:
          type: string
          enum: [sent, skipped, failed]
          description: sent = ส่งสำเร็จ, skipped = ไม่ได้ตั้งค่า webhook, failed = Discord ล้มเหลว
        error:
          type: string
          description: สาเหตุ (มีเฉพาะเมื่อ status เป็น skipped หรือ failed)
          example: Discord ตอบ HTTP 503
        createdAt:
          type: string
          format: date-time

    NotificationRequest:
      type: object
      required: [type, boardgame]
      properties:
        type:
          type: string
          enum: [boardgame.created]
        boardgame:
          type: object
          required: [name, minPlayers, maxPlayers]
          properties:
            id:
              type: integer
              example: 4
            name:
              type: string
              example: Carcassonne
            minPlayers:
              type: integer
              example: 2
            maxPlayers:
              type: integer
              example: 5

    MessageOnly:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: รหัสข้อผิดพลาดสำหรับให้โปรแกรมนำไปใช้
            message:
              type: string
              description: ข้อความอธิบายข้อผิดพลาด

  responses:
    InvalidId:
      description: id ไม่ถูกต้อง (ต้องเป็นจำนวนเต็มบวก)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_ID
              message: id ต้องเป็นตัวเลขจำนวนเต็มบวก

    BoardgameNotFound:
      description: ไม่พบบอร์ดเกม
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบบอร์ดเกม

    CategoryNotFound:
      description: ไม่พบหมวดหมู่
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CATEGORY_NOT_FOUND
              message: ไม่พบหมวดหมู่

    DuplicateName:
      description: มีชื่อบอร์ดเกมนี้อยู่ในระบบแล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE_NAME
              message: มีชื่อบอร์ดเกมนี้อยู่ในระบบแล้ว

    DuplicateCategory:
      description: มีชื่อหมวดหมู่นี้อยู่ในระบบแล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE_CATEGORY
              message: มีชื่อหมวดหมู่นี้อยู่ในระบบแล้ว

    CategoryNameInvalid:
      description: name ไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingFields:
              summary: ไม่ได้ส่ง name
              value:
                error:
                  code: MISSING_FIELDS
                  message: กรุณาระบุ name
            invalidName:
              summary: name ว่างหรือยาวเกิน 100 ตัวอักษร
              value:
                error:
                  code: INVALID_NAME
                  message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
            malformedJson:
              $ref: "#/components/examples/MalformedJson"

    PayloadTooLarge:
      description: request body ใหญ่เกิน 10 KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: entity.too.large
              message: request entity too large

    ServerError:
      description: เกิดข้อผิดพลาดภายในระบบ (เช่น เชื่อมต่อฐานข้อมูลไม่ได้)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดที่ไม่คาดคิดภายในระบบ
