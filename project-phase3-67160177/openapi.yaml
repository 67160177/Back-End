                invalidName:
                  summary: name ว่างหรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                malformedJson:
