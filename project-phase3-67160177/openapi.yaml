openapi: 3.0.3

info:
  title: Board Game Management API
  version: 3.0.0
  description: |
    API สำหรับระบบจัดการข้อมูลบอร์ดเกม (Board Game Management System)
    จัดการข้อมูลบอร์ดเกม หมวดหมู่ และความสัมพันธ์แบบ Many-to-Many ระหว่างสองสิ่งนี้

    **สถาปัตยกรรม (ระยะที่ 3)** ระบบประกอบด้วย 2 service
    - **Board Game API** (`http://localhost:3000`) จัดการข้อมูลบอร์ดเกม/หมวดหมู่ เชื่อมต่อ MySQL
    - **Notification Service** (`http://localhost:3001`) microservice ที่รับคำขอแจ้งเตือนจาก API หลักแล้วส่งต่อไปที่ Discord Webhook

    endpoint ของ Notification Service อยู่ใน tag **Notification Service** (Swagger UI จะเรียกไปที่พอร์ต 3001 ให้อัตโนมัติ)

    **รูปแบบ Response**
    - สำเร็จ: `{ "message": "...", "data": ... }`
    - ผิดพลาด: `{ "error": { "code": "...", "message": "..." } }`

    **ข้อควรทราบ**
    - ขนาด request body สูงสุด 10 KB (เกินจะได้ 413)
    - ถ้า JSON ใน body ผิดรูปแบบ จะได้ 400 พร้อม `error.code = "entity.parse.failed"`
    - ฟิลด์ที่เป็น integer (`minPlayers`, `maxPlayers`, `category_id`) ต้องส่งเป็นตัวเลขใน JSON ไม่ใช่ข้อความ (เช่น `2` ไม่ใช่ `"2"`)
    - ชื่อ (`name`) จะถูกตัดช่องว่างหัวท้ายก่อนบันทึก
    - path ที่ไม่มีอยู่จะได้ 404 พร้อม `error.code = "ROUTE_NOT_FOUND"`

servers:
  - url: http://localhost:3000
    description: Board Game API (Local development)

# ระบบนี้ยังไม่มีการยืนยันตัวตน ทุก endpoint เป็น public
security: []

tags:
  - name: Health
    description: ตรวจสอบสถานะระบบ
  - name: Boardgames
    description: จัดการข้อมูลบอร์ดเกม
  - name: Categories
    description: จัดการหมวดหมู่
  - name: Boardgame Categories
    description: จัดการความสัมพันธ์ระหว่างบอร์ดเกมกับหมวดหมู่
  - name: Notifications
    description: ประวัติการแจ้งเตือน (API หลักส่งต่อคำขอไปยัง Notification Service)
  - name: Notification Service
    description: endpoint ของ microservice แจ้งเตือน (พอร์ต 3001)

paths:
  /:
    get:
      tags: [Health]
      summary: ตรวจสอบว่าเซิร์ฟเวอร์ทำงานอยู่
      operationId: getRoot
      responses:
        "200":
          description: เซิร์ฟเวอร์พร้อมใช้งาน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: Board Game API พร้อมใช้งาน

  /api/v1/health:
    get:
      tags: [Health]
      summary: ตรวจสอบสถานะของทุก service
      operationId: getSystemHealth
      description: |
        ตรวจ API, ฐานข้อมูล (`SELECT 1`) และ Notification Service (`GET /health` timeout 1 วินาที)

        - ทุกอย่างปกติ: 200 `status = ok`
        - Notification Service ล่ม: 200 `status = degraded` (ระบบหลักยังใช้ได้ เพียงแต่ไม่มีแจ้งเตือน)
        - ฐานข้อมูลล่ม: 503 `status = down`
      responses:
        "200":
          description: ระบบใช้งานได้ (ok หรือ degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
              examples:
                ok:
                  summary: ทุก service ปกติ
                  value:
                    status: ok
                    services: { api: up, database: up, notificationService: up }
                degraded:
                  summary: Notification Service ล่ม
                  value:
                    status: degraded
                    services: { api: up, database: up, notificationService: down }
        "503":
          description: ฐานข้อมูลใช้งานไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
              example:
                status: down
                services: { api: up, database: down, notificationService: up }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: ดึงประวัติการแจ้งเตือนล่าสุด
      operationId: listNotifications
      description: |
        API หลักส่งต่อคำขอไปที่ `GET http://localhost:3001/notifications` (timeout 2 วินาที ไม่ retry)
        แล้วคืนผลให้ผู้เรียก ถ้าเชื่อมต่อ Notification Service ไม่ได้จะได้ 503
      responses:
        "200":
          description: สำเร็จ (ใหม่สุดอยู่ก่อน สูงสุด 50 รายการ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationRecord"
        "503":
          description: เชื่อมต่อ Notification Service ไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOTIFICATION_SERVICE_UNAVAILABLE
                  message: ไม่สามารถเชื่อมต่อ notification-service ได้ในขณะนี้

  /api/v1/boardgames:
    get:
      tags: [Boardgames]
      summary: ดึงรายการบอร์ดเกมทั้งหมด
      operationId: listBoardgames
      description: |
        คืนรายการบอร์ดเกมพร้อมชื่อหมวดหมู่ (คั่นด้วยจุลภาค) รองรับการกรองตามหมวดหมู่

        - ถ้าส่งทั้ง `category` และ `category_id` จะใช้ `category` เท่านั้น
        - เมื่อกรองตามหมวดหมู่ ฟิลด์ `categories` ของแต่ละเกมจะแสดงเฉพาะหมวดหมู่ที่ตรงกับตัวกรอง
      parameters:
        - name: category
          in: query
          required: false
          description: ชื่อหมวดหมู่ (ไม่สนใจตัวพิมพ์เล็กใหญ่)
          schema:
            type: string
            example: strategy
        - name: category_id
          in: query
          required: false
          description: ID ของหมวดหมู่
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: สำเร็จ (ถ้าไม่พบข้อมูลที่ตรงเงื่อนไข จะได้ `data` เป็นอาร์เรย์ว่าง)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Boardgame"
        "400":
          description: query parameter ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidCategoryId:
                  summary: category_id ไม่ใช่จำนวนเต็มบวก
                  value:
                    error:
                      code: INVALID_ID
                      message: category_id ต้องเป็นตัวเลขจำนวนเต็มบวก
                invalidQuery:
                  summary: ส่ง category ซ้ำหลายค่า
                  value:
                    error:
                      code: INVALID_QUERY
                      message: category ต้องเป็นข้อความและระบุได้เพียงค่าเดียว
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [Boardgames]
      summary: เพิ่มบอร์ดเกมใหม่
      operationId: createBoardgame
      description: |
        เมื่อเพิ่มสำเร็จ ระบบจะส่งแจ้งเตือนไปที่ Discord (API ภายนอก) ด้วย
        โดยมี timeout, retry (ลองใหม่เมื่อ network error / timeout / 5xx) และ fallback

        ถ้าแจ้งเตือนไม่สำเร็จ ระบบยังตอบ 201 ตามปกติ โดยฟิลด์ `notification.sent` จะเป็น `false`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardgameInput"
      responses:
        "201":
          description: เพิ่มบอร์ดเกมสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: เพิ่มบอร์ดเกมสำเร็จ
                  data:
                    $ref: "#/components/schemas/BoardgameBase"
                  notification:
                    $ref: "#/components/schemas/Notification"
        "400":
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  summary: ส่งข้อมูลไม่ครบ
                  value:
                    error:
                      code: MISSING_FIELDS
                      message: กรุณาระบุ name, minPlayers และ maxPlayers ให้ครบถ้วน
                invalidName:
                  summary: name ว่าง ไม่ใช่ข้อความ หรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                invalidPlayers:
                  summary: จำนวนผู้เล่นไม่ใช่จำนวนเต็ม
                  value:
                    error:
                      code: INVALID_PLAYERS
                      message: minPlayers และ maxPlayers ต้องเป็นตัวเลขจำนวนเต็ม
                invalidPlayerRange:
                  summary: ช่วงจำนวนผู้เล่นไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_PLAYER_RANGE
                      message: จำนวนผู้เล่นต้องอยู่ระหว่าง 1 ถึง 2147483647 และ maxPlayers ต้องมากกว่าหรือเท่ากับ minPlayers
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "409":
          $ref: "#/components/responses/DuplicateName"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/boardgames/{id}:
    parameters:
      - $ref: "#/components/parameters/BoardgameId"

    get:
      tags: [Boardgames]
      summary: ดึงข้อมูลบอร์ดเกมตาม ID
      operationId: getBoardgameById
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: "#/components/schemas/Boardgame"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/BoardgameNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Boardgames]
      summary: แก้ไขข้อมูลบอร์ดเกมทั้งระเบียน
      operationId: replaceBoardgame
      description: ต้องส่งครบทุกฟิลด์ (`name`, `minPlayers`, `maxPlayers`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardgameInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลบอร์ดเกมสำเร็จ
                  data:
                    $ref: "#/components/schemas/BoardgameBase"
        "400":
          description: id หรือข้อมูลที่ส่งมาไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: id ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_ID
                      message: id ต้องเป็นตัวเลขจำนวนเต็มบวก
                missingFields:
                  summary: ส่งข้อมูลไม่ครบ
                  value:
                    error:
                      code: MISSING_FIELDS
                      message: กรุณาระบุ name, minPlayers และ maxPlayers ให้ครบถ้วน
                invalidName:
                  summary: name ว่าง ไม่ใช่ข้อความ หรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                invalidPlayers:
                  summary: จำนวนผู้เล่นไม่ใช่จำนวนเต็ม
                  value:
                    error:
                      code: INVALID_PLAYERS
                      message: minPlayers และ maxPlayers ต้องเป็นตัวเลขจำนวนเต็ม
                invalidPlayerRange:
                  summary: ช่วงจำนวนผู้เล่นไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_PLAYER_RANGE
                      message: จำนวนผู้เล่นต้องอยู่ระหว่าง 1 ถึง 2147483647 และ maxPlayers ต้องมากกว่าหรือเท่ากับ minPlayers
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "404":
          $ref: "#/components/responses/BoardgameNotFound"
        "409":
          $ref: "#/components/responses/DuplicateName"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Boardgames]
      summary: แก้ไขข้อมูลบอร์ดเกมบางฟิลด์
      operationId: updateBoardgame
      description: |
        ส่งเฉพาะฟิลด์ที่ต้องการแก้ไข ระบบจะนำค่าที่ส่งมารวมกับค่าเดิม
        แล้วตรวจว่า `maxPlayers >= minPlayers` และ `minPlayers >= 1`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardgamePatchInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลบอร์ดเกมสำเร็จ
                  data:
                    $ref: "#/components/schemas/BoardgameBase"
        "400":
          description: id หรือข้อมูลที่ส่งมาไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: id ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_ID
                      message: id ต้องเป็นตัวเลขจำนวนเต็มบวก
                noUpdates:
                  summary: ไม่ได้ส่งฟิลด์ใดมาเลย
                  value:
                    error:
                      code: NO_UPDATES
                      message: กรุณาระบุข้อมูลที่ต้องการแก้ไข
                invalidField:
                  summary: ส่งฟิลด์ที่ไม่อนุญาต
                  value:
                    error:
                      code: INVALID_FIELD
                      message: "ไม่อนุญาตให้แก้ไข field: price"
                invalidName:
                  summary: name ว่าง ไม่ใช่ข้อความ หรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                invalidPlayers:
                  summary: จำนวนผู้เล่นไม่ใช่จำนวนเต็ม
                  value:
                    error:
                      code: INVALID_PLAYERS
                      message: maxPlayers ต้องเป็นตัวเลขจำนวนเต็ม
                invalidPlayerRange:
                  summary: ค่ารวมแล้ว maxPlayers น้อยกว่า minPlayers
                  value:
                    error:
                      code: INVALID_PLAYER_RANGE
                      message: จำนวนผู้เล่นต้องอยู่ระหว่าง 1 ถึง 2147483647 และ maxPlayers ต้องมากกว่าหรือเท่ากับ minPlayers
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "404":
          $ref: "#/components/responses/BoardgameNotFound"
        "409":
          $ref: "#/components/responses/DuplicateName"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Boardgames]
      summary: ลบบอร์ดเกม
      operationId: deleteBoardgame
      description: ความสัมพันธ์กับหมวดหมู่ของเกมนี้จะถูกลบตามไปด้วย (ON DELETE CASCADE)
      responses:
        "200":
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnly"
              example:
                message: ลบบอร์ดเกมสำเร็จ
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/BoardgameNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: ดึงรายการหมวดหมู่ทั้งหมด
      operationId: listCategories
      description: คืนหมวดหมู่ทุกรายการพร้อมจำนวนบอร์ดเกมในแต่ละหมวด (`boardgameCount`)
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryWithCount"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [Categories]
      summary: เพิ่มหมวดหมู่ใหม่
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: เพิ่มหมวดหมู่สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: เพิ่มหมวดหมู่สำเร็จ
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/CategoryNameInvalid"
        "409":
          $ref: "#/components/responses/DuplicateCategory"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"

    get:
      tags: [Categories]
      summary: ดึงข้อมูลหมวดหมู่ตาม ID
      operationId: getCategoryById
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: "#/components/schemas/CategoryWithCount"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Categories]
      summary: แก้ไขชื่อหมวดหมู่
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: แก้ไขหมวดหมู่สำเร็จ
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          description: id หรือ name ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: id ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_ID
                      message: id ต้องเป็นตัวเลขจำนวนเต็มบวก
                missingFields:
