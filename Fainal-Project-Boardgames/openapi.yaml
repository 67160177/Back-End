  # ==========================================
  # Internal Services (Gateway และ service ด้วยกันเป็นผู้เรียก)
  # ==========================================

  /health:
    servers:
      - url: http://localhost:{port}
        description: service ภายใน (เลือกพอร์ต)
        variables:
          port:
            enum: ["4001", "4002", "4003"]
            default: "4001"
            description: 4001 = boardgame-service, 4002 = notification-service, 4003 = auth-service
    get:
      tags: [Internal Services]
      summary: ตรวจสอบสถานะของ service (ทุก service ใช้รูปแบบเดียวกัน)
      operationId: getServiceHealth
      description: |
        Gateway เรียก endpoint นี้ของทุก service เพื่อสรุปผลใน `GET /api/v1/health`
        - boardgame-service และ auth-service: ตอบ 503 ถ้าฐานข้อมูลใช้ไม่ได้ และมีฟิลด์ `database`
        - notification-service: มีฟิลด์ `discordConfigured`
      responses:
        "200":
          description: service ทำงานอยู่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
              examples:
                boardgame:
                  summary: boardgame-service (4001)
                  value: { status: ok, service: boardgame-service, database: up }
                notification:
                  summary: notification-service (4002)
                  value: { status: ok, service: notification-service, discordConfigured: true }
                auth:
                  summary: auth-service (4003)
                  value: { status: ok, service: auth-service, database: up }
        "503":
          description: boardgame-service ต่อฐานข้อมูลไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
              example: { status: down, service: boardgame-service, database: down }

  /notifications:
    servers:
      - url: http://localhost:4002
        description: notification-service
    get:
      tags: [Internal Services]
      summary: ดึงประวัติการแจ้งเตือน (เก็บในหน่วยความจำ)
      operationId: getNotificationHistory
      description: Gateway ส่งต่อ `GET /api/v1/notifications` มาที่ endpoint นี้
      responses:
        "200":
          $ref: "#/components/responses/NotificationHistory"
    post:
      tags: [Internal Services]
      summary: ส่งแจ้งเตือนบอร์ดเกมใหม่ไปที่ Discord (notification-service)
      operationId: sendNotification
      description: |
        boardgame-service เรียก endpoint นี้ตรง (ไม่ผ่าน Gateway) หลังเพิ่มบอร์ดเกมสำเร็จ
        service จะส่งข้อความไป Discord **1 ครั้ง** พร้อม timeout (`DISCORD_TIMEOUT_MS` ค่าเริ่มต้น 1500 ms)

        - ส่งสำเร็จ: 200 `sent = true`
        - ไม่ได้ตั้งค่า webhook: 200 `sent = false` (ไม่ใช่ความผิดพลาดชั่วคราว ผู้เรียกไม่ต้อง retry)
        - Discord ล้มเหลว/ติดต่อไม่ได้: 502 / Discord ตอบช้าเกิน timeout: 504
          (เป็น 5xx เพื่อให้ boardgame-service retry ตามกลไกใน `src/services/external-api.js`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
      responses:
        "200":
          description: ประมวลผลแล้ว (ดูผลที่ `data.sent`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ส่งแจ้งเตือนไปที่ Discord แล้ว
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      sent:
                        type: boolean
                        example: true
              examples:
                sent:
                  summary: ส่งสำเร็จ
                  value:
                    message: ส่งแจ้งเตือนไปที่ Discord แล้ว
                    data: { id: 1, sent: true }
                skipped:
                  summary: ไม่ได้ตั้งค่า webhook
                  value:
                    message: ไม่ได้ตั้งค่า Discord Webhook จึงไม่ได้ส่งแจ้งเตือน
                    data: { id: 2, sent: false }
        "400":
          description: ข้อมูลคำขอไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidType:
                  summary: type ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_NOTIFICATION
                      message: type ต้องเป็น "boardgame.created"
                invalidBoardgame:
                  summary: ข้อมูลบอร์ดเกมไม่ครบ
                  value:
                    error:
                      code: INVALID_NOTIFICATION
                      message: boardgame ต้องมี name (ข้อความ), minPlayers และ maxPlayers (จำนวนเต็ม)
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "502":
          description: Discord ตอบผิดพลาดหรือติดต่อไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: DISCORD_ERROR
                  message: Discord ตอบ HTTP 503
        "504":
          description: Discord ไม่ตอบภายในเวลาที่กำหนด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: DISCORD_TIMEOUT
                  message: Discord ไม่ตอบภายใน 1500 ms

  /auth/register:
    servers:
      - url: http://localhost:4003
        description: auth-service
    post:
      tags: [Internal Services]
      summary: สมัครสมาชิก (auth-service)
      operationId: authServiceRegister
      description: Gateway ส่งต่อ `POST /api/v1/auth/register` มาที่นี่ (request/response เหมือนกัน)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: สมัครสำเร็จ
        "400":
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: username ถูกใช้แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    servers:
      - url: http://localhost:4003
        description: auth-service
    post:
      tags: [Internal Services]
      summary: ตรวจรหัสผ่านและออก JWT (auth-service)
      operationId: authServiceLogin
      description: Gateway ส่งต่อ `POST /api/v1/auth/login` มาที่นี่ token ลงชื่อด้วย HS256 + `JWT_SECRET` อายุ `JWT_EXPIRES_IN` (ค่าเริ่มต้น 2h) payload มี `sub` (id), `username` และ `role`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: ส่งข้อมูลไม่ครบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: username หรือ password ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: ยังไม่ได้ตั้งค่า JWT_SECRET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    servers:
      - url: http://localhost:4003
        description: auth-service
    get:
      tags: [Internal Services]
      summary: ข้อมูลผู้ใช้จาก token (auth-service ตรวจ token ซ้ำเอง)
      operationId: authServiceMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: token ไม่ถูกต้อง หมดอายุ หรือไม่พบผู้ใช้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: token จาก `POST /api/v1/auth/login` (ใส่เฉพาะ token ไม่ต้องพิมพ์คำว่า Bearer)

  headers:
    XCache:
      description: "`HIT` = ตอบจาก cache ของ boardgame-service (ไม่ได้อ่านฐานข้อมูล), `MISS` = อ่านจากฐานข้อมูลแล้วเก็บลง cache"
      schema:
        type: string
        enum: [HIT, MISS]

  parameters:
    BoardgameId:
      name: id
      in: path
      required: true
      description: ID ของบอร์ดเกม (จำนวนเต็มบวก)
      schema:
        type: integer
        minimum: 1
        example: 1
    CategoryId:
      name: id
      in: path
      required: true
      description: ID ของหมวดหมู่ (จำนวนเต็มบวก)
      schema:
        type: integer
        minimum: 1
        example: 1

  examples:
    MalformedJson:
      summary: JSON ใน body ผิดรูปแบบ
      value:
        error:
          code: entity.parse.failed
          message: Expected double-quoted property name in JSON at position 20 (line 3 column 1)

  schemas:
    Boardgame:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Catan
        minPlayers:
          type: integer
          example: 3
        maxPlayers:
          type: integer
          example: 4
        categories:
          type: string
          nullable: true
          description: ชื่อหมวดหมู่คั่นด้วยจุลภาค เป็น `null` ถ้าเกมยังไม่มีหมวดหมู่
          example: Strategy,Party Game

    BoardgameBase:
      type: object
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: Carcassonne
        minPlayers:
          type: integer
          example: 2
        maxPlayers:
          type: integer
          example: 5

    BoardgameInput:
      type: object
      required: [name, minPlayers, maxPlayers]
      properties:
        name:
          type: string
          maxLength: 100
          description: ชื่อบอร์ดเกม (ห้ามซ้ำกับที่มีอยู่)
          example: Carcassonne
        minPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 2
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: ต้องมากกว่าหรือเท่ากับ `minPlayers`
          example: 5

    BoardgamePatchInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          example: Carcassonne Deluxe
        minPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 2
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 6

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Strategy

    CategoryWithCount:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            boardgameCount:
              type: integer
              description: จำนวนบอร์ดเกมในหมวดหมู่นี้
              example: 2

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: ชื่อหมวดหมู่ (ห้ามซ้ำกับที่มีอยู่)
          example: Co-op

    CategoryLinkInput:
      type: object
      required: [category_id]
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 2

    Notification:
      type: object
      description: ผลการส่งแจ้งเตือนไปยัง API ภายนอก (Discord Webhook)
      properties:
        sent:
          type: boolean
          description: ส่งแจ้งเตือนสำเร็จหรือไม่
          example: true
        attempts:
          type: integer
          description: จำนวนครั้งที่เรียก API ภายนอก (ครั้งแรก + retry)
          example: 1
        message:
          type: string
          example: ส่งแจ้งเตือนไปที่ Discord แล้ว

    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        services:
          type: object
          properties:
            gateway:
              type: string
              enum: [up]
            boardgameService:
              type: string
              enum: [up, down]
            database:
              type: string
              enum: [up, down, unknown]
              description: unknown เมื่อติดต่อ boardgame-service ไม่ได้
            notificationService:
              type: string
              enum: [up, down]
            authService:
              type: string
              enum: [up, down]

    ServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, down]
        service:
          type: string
          enum: [boardgame-service, notification-service, auth-service]
        database:
          type: string
          enum: [up, down]
          description: เฉพาะ boardgame-service และ auth-service
        discordConfigured:
          type: boolean
          description: เฉพาะ notification-service

    NotificationRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          example: boardgame.created
        message:
          type: string
          example: "🎲 เพิ่มบอร์ดเกมใหม่: Carcassonne (2-5 ผู้เล่น)"
        status:
          type: string
          enum: [sent, skipped, failed]
          description: sent = ส่งสำเร็จ, skipped = ไม่ได้ตั้งค่า webhook, failed = Discord ล้มเหลว
        error:
          type: string
          description: สาเหตุ (มีเฉพาะเมื่อ status เป็น skipped หรือ failed)
          example: Discord ตอบ HTTP 503
        createdAt:
          type: string
          format: date-time

    NotificationRequest:
      type: object
      required: [type, boardgame]
      properties:
        type:
          type: string
          enum: [boardgame.created]
        boardgame:
          type: object
          required: [name, minPlayers, maxPlayers]
          properties:
            id:
              type: integer
              example: 4
            name:
              type: string
              example: Carcassonne
            minPlayers:
              type: integer
              example: 2
            maxPlayers:
              type: integer
              example: 5

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: จำนวนบอร์ดเกมทั้งหมดที่ตรงเงื่อนไข (ก่อนแบ่งหน้า)
          example: 3
        totalPages:
          type: integer
          example: 1

    MessageOnly:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: รหัสข้อผิดพลาดสำหรับให้โปรแกรมนำไปใช้
            message:
              type: string
              description: ข้อความอธิบายข้อผิดพลาด

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: correct-horse

    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,30}$"
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: correct-horse

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: alice
        role:
          type: string
          enum: [member, admin]
          description: admin ลบบอร์ดเกม/หมวดหมู่ได้ / member เพิ่มและแก้ไขได้
        createdAt:
          type: string
          format: date-time

    LoginResult:
      type: object
      properties:
        message:
          type: string
          example: เข้าสู่ระบบสำเร็จ
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: string
              example: 2h
            user:
              $ref: "#/components/schemas/User"

  responses:
    Unauthorized:
      description: ไม่ได้เข้าสู่ระบบ / token หมดอายุ / token ไม่ถูกต้อง (Gateway ไม่ส่งต่อคำขอ)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            noToken:
              summary: ไม่แนบ token
              value:
                error: { code: UNAUTHORIZED, message: กรุณาเข้าสู่ระบบก่อน (ไม่พบ token) }
            expired:
              summary: token หมดอายุ
              value:
                error: { code: TOKEN_EXPIRED, message: การเข้าสู่ระบบหมดอายุ กรุณาเข้าสู่ระบบใหม่ }
            invalid:
              summary: token ปลอมหรือเสีย
              value:
                error: { code: INVALID_TOKEN, message: token ไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่ }

    Forbidden:
      description: เข้าสู่ระบบแล้วแต่ไม่ใช่ admin (Gateway ไม่ส่งต่อคำขอ) ถ้าเพิ่งถูกเลื่อนเป็น admin ให้เข้าสู่ระบบใหม่เพื่อรับ token ที่มี role ล่าสุด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: FORBIDDEN, message: เฉพาะผู้ดูแลระบบ (admin) เท่านั้นที่ลบข้อมูลได้ }

    TooManyAuthAttempts:
      description: พยายามเข้าสู่ระบบ/สมัครสมาชิกเกิน 10 ครั้งต่อนาที
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: TOO_MANY_REQUESTS, message: พยายามเข้าสู่ระบบ/สมัครสมาชิกบ่อยเกินไป กรุณาลองใหม่ในอีก 42 วินาที }

    ServiceUnavailable:
      description: Gateway ติดต่อ service ปลายทางไม่ได้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: boardgame-service ไม่พร้อมใช้งานในขณะนี้

    GatewayTimeout:
      description: service ปลายทางไม่ตอบภายใน GATEWAY_TIMEOUT_MS (ค่าเริ่มต้น 10 วินาที)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: GATEWAY_TIMEOUT
              message: boardgame-service ไม่ตอบภายในเวลาที่กำหนด กรุณาลองใหม่

    NotificationHistory:
      description: สำเร็จ (ใหม่สุดอยู่ก่อน สูงสุด 50 รายการ)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: สำเร็จ
              data:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"

    InvalidId:
      description: id ไม่ถูกต้อง (ต้องเป็นจำนวนเต็มบวก)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_ID
              message: id ต้องเป็นตัวเลขจำนวนเต็มบวก

    BoardgameNotFound:
      description: ไม่พบบอร์ดเกม
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบบอร์ดเกม

    CategoryNotFound:
      description: ไม่พบหมวดหมู่
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CATEGORY_NOT_FOUND
              message: ไม่พบหมวดหมู่

    DuplicateName:
      description: มีชื่อบอร์ดเกมนี้อยู่ในระบบแล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE_NAME
              message: มีชื่อบอร์ดเกมนี้อยู่ในระบบแล้ว

    DuplicateCategory:
      description: มีชื่อหมวดหมู่นี้อยู่ในระบบแล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE_CATEGORY
              message: มีชื่อหมวดหมู่นี้อยู่ในระบบแล้ว

    CategoryNameInvalid:
      description: name ไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingFields:
              summary: ไม่ได้ส่ง name
              value:
                error:
                  code: MISSING_FIELDS
                  message: กรุณาระบุ name
            invalidName:
              summary: name ว่างหรือยาวเกิน 100 ตัวอักษร
              value:
                error:
                  code: INVALID_NAME
                  message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
            malformedJson:
              $ref: "#/components/examples/MalformedJson"

    PayloadTooLarge:
      description: request body ใหญ่เกิน 10 KB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: entity.too.large
              message: request entity too large

    ServerError:
      description: เกิดข้อผิดพลาดภายในระบบ (เช่น เชื่อมต่อฐานข้อมูลไม่ได้)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: เกิดข้อผิดพลาดที่ไม่คาดคิดภายในระบบ
