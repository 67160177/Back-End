openapi: 3.0.3

info:
  title: Board Game Management API
  version: 3.0.0
  description: |
    API สำหรับระบบจัดการข้อมูลบอร์ดเกม (Board Game Management System)
    จัดการข้อมูลบอร์ดเกม หมวดหมู่ และความสัมพันธ์แบบ Many-to-Many ระหว่างสองสิ่งนี้

    **สถาปัตยกรรม (ระยะที่ 3)** client เรียกทุกอย่างผ่าน **API Gateway** (`http://localhost:3000`) ซึ่งส่งต่อไปยัง service ภายใน
    - **boardgame-service** (`:4001`) บอร์ดเกม หมวดหมู่ ความสัมพันธ์ N:M เชื่อมต่อ MySQL
    - **notification-service** (`:4002`) ส่งแจ้งเตือนเข้า Discord Webhook และเก็บประวัติ
    - **auth-service** (`:4003`) สมัครสมาชิก เข้าสู่ระบบ ออก JWT (เจ้าของตาราง `users`)

    endpoint ภายในของแต่ละ service อยู่ใน tag **Internal Services** (client ไม่ควรเรียกตรง)

    **การยืนยันตัวตน (JWT)**
    - ดูข้อมูล (`GET`) ได้ทุกคนโดยไม่ต้องเข้าสู่ระบบ
    - เพิ่ม/แก้ไข/ลบ (`POST`/`PUT`/`PATCH`/`DELETE` ของบอร์ดเกม หมวดหมู่ ความสัมพันธ์) ต้องแนบ header `Authorization: Bearer <token>`
    - **ลบบอร์ดเกม** และ **ลบหมวดหมู่** ต้องเป็น role `admin` (member ได้ 403 `FORBIDDEN`) สมัครผ่าน API ได้ `member` เสมอ ส่วน admin สร้างด้วย `npm run create-admin`
    - ได้ token จาก `POST /api/v1/auth/login` (อายุ 2 ชั่วโมง) ใน Swagger UI กดปุ่ม **Authorize** แล้ววาง token
    - Gateway ตรวจ token เอง: ไม่มี token → 401 `UNAUTHORIZED`, หมดอายุ → 401 `TOKEN_EXPIRED`, ปลอม/เสีย → 401 `INVALID_TOKEN` (คำขอไม่ถูกส่งต่อไป service)

    **รูปแบบ Response**
    - สำเร็จ: `{ "message": "...", "data": ... }`
    - ผิดพลาด: `{ "error": { "code": "...", "message": "..." } }`

    **ข้อควรทราบ**
    - ขนาด request body สูงสุด 10 KB (เกินจะได้ 413)
    - ถ้า JSON ใน body ผิดรูปแบบ จะได้ 400 พร้อม `error.code = "entity.parse.failed"`
    - ฟิลด์ที่เป็น integer (`minPlayers`, `maxPlayers`, `category_id`) ต้องส่งเป็นตัวเลขใน JSON ไม่ใช่ข้อความ (เช่น `2` ไม่ใช่ `"2"`)
    - ชื่อ (`name`) จะถูกตัดช่องว่างหัวท้ายก่อนบันทึก
    - path ที่ไม่มีอยู่จะได้ 404 พร้อม `error.code = "ROUTE_NOT_FOUND"`
    - ถ้า service ปลายทางไม่พร้อม Gateway ตอบ 503 `SERVICE_UNAVAILABLE` / ตอบช้าเกิน 10 วินาที ตอบ 504 `GATEWAY_TIMEOUT`

    **Rate limiting** (ตรวจที่ Gateway นับแยกตาม IP เกินแล้วได้ 429 `TOO_MANY_REQUESTS` พร้อม header `Retry-After`)
    - `/api/v1/*` ทั้งหมด: 300 ครั้ง/นาที (`RATE_LIMIT_MAX`, `RATE_LIMIT_WINDOW_MS`) ยกเว้น `/api/v1/health`
    - `/api/v1/auth/login` และ `/api/v1/auth/register` รวมกัน: 10 ครั้ง/นาที (`AUTH_RATE_LIMIT_MAX`) กันการเดารหัสผ่าน
    - ทุกคำตอบมี header `RateLimit` และ `RateLimit-Policy` บอกโควตาที่เหลือ

    **Caching** GET ของบอร์ดเกม/หมวดหมู่ถูก cache ที่ boardgame-service 30 วินาที (`CACHE_TTL_MS`)
    และถูกล้างทันทีเมื่อมีการเพิ่ม แก้ไข หรือลบสำเร็จ header `X-Cache` บอกว่าเป็น `HIT` หรือ `MISS`

servers:
  - url: http://localhost:3000
    description: API Gateway (Local development)

# ค่าเริ่มต้น: ไม่ต้องยืนยันตัวตน / endpoint เพิ่ม-แก้ไข-ลบ ระบุ security: bearerAuth เอง
security: []

tags:
  - name: Health
    description: ตรวจสอบสถานะระบบ
  - name: Boardgames
    description: จัดการข้อมูลบอร์ดเกม (Gateway ส่งต่อไป boardgame-service)
  - name: Categories
    description: จัดการหมวดหมู่ (Gateway ส่งต่อไป boardgame-service)
  - name: Boardgame Categories
    description: จัดการความสัมพันธ์ระหว่างบอร์ดเกมกับหมวดหมู่ (Gateway ส่งต่อไป boardgame-service)
  - name: Notifications
    description: ประวัติการแจ้งเตือน (Gateway ส่งต่อไป notification-service)
  - name: Auth
    description: สมัครสมาชิกและเข้าสู่ระบบ (Gateway ส่งต่อไป auth-service)
  - name: Internal Services
    description: endpoint ภายในของแต่ละ microservice (Gateway และ service ด้วยกันเป็นผู้เรียก ไม่เปิดให้ client)

paths:
  /:
    get:
      tags: [Health]
      summary: ข้อมูลของ API Gateway
      operationId: getRoot
      responses:
        "200":
          description: Gateway พร้อมใช้งาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  frontend:
                    type: string
                  docs:
                    type: string
              example:
                message: Board Game API Gateway พร้อมใช้งาน
                frontend: /app
                docs: /api-docs

  /api/v1/health:
    get:
      tags: [Health]
      summary: ตรวจสอบสถานะของทุก service
      operationId: getSystemHealth
      description: |
        Gateway เรียก `GET /health` ของทุก service พร้อมกัน (timeout 2 วินาทีต่อ service)

        - ทุก service ปกติ: 200 `status = ok`
        - notification-service หรือ auth-service ล่ม: 200 `status = degraded` (ยังดู/ค้นหาบอร์ดเกมได้)
        - boardgame-service ล่ม (รวมถึงฐานข้อมูลล่ม): 503 `status = down`
      responses:
        "200":
          description: ระบบใช้งานได้ (ok หรือ degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
              examples:
                ok:
                  summary: ทุก service ปกติ
                  value:
                    status: ok
                    services: { gateway: up, boardgameService: up, database: up, notificationService: up, authService: up }
                degraded:
                  summary: notification-service ล่ม
                  value:
                    status: degraded
                    services: { gateway: up, boardgameService: up, database: up, notificationService: down, authService: up }
        "503":
          description: boardgame-service หรือฐานข้อมูลใช้งานไม่ได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
              example:
                status: down
                services: { gateway: up, boardgameService: down, database: down, notificationService: up, authService: up }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: ดึงประวัติการแจ้งเตือนล่าสุด
      operationId: listNotifications
      description: Gateway ส่งต่อไปที่ `GET http://localhost:4002/notifications` ของ notification-service
      responses:
        "200":
          $ref: "#/components/responses/NotificationHistory"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: สมัครสมาชิก
      operationId: register
      description: |
        Gateway ส่งต่อไปที่ `POST http://localhost:4003/auth/register` ของ auth-service
        รหัสผ่านถูกเก็บเป็น scrypt hash + salt สุ่ม ไม่เก็บรหัสผ่านจริง
        สมัครแล้วต้องเรียก `/api/v1/auth/login` เพื่อรับ token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: สมัครสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สมัครสมาชิกสำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: alice
                      role:
                        type: string
                        enum: [member]
                        description: สมัครผ่าน API ได้ member เสมอ
        "400":
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  summary: ส่งไม่ครบ
                  value:
                    error: { code: MISSING_FIELDS, message: กรุณาระบุ username และ password ให้ครบถ้วน }
                invalidUsername:
                  summary: username ผิดรูปแบบ
                  value:
                    error: { code: INVALID_USERNAME, message: "username ต้องยาว 3-30 ตัวอักษร ใช้ได้เฉพาะ a-z, A-Z, 0-9 และ _" }
                invalidPassword:
                  summary: password สั้น/ยาวเกิน
                  value:
                    error: { code: INVALID_PASSWORD, message: password ต้องยาว 8-72 ตัวอักษร }
        "409":
          description: username ถูกใช้แล้ว (ไม่สนตัวพิมพ์เล็ก/ใหญ่)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: USERNAME_TAKEN, message: username นี้ถูกใช้แล้ว }
        "429":
          $ref: "#/components/responses/TooManyAuthAttempts"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: เข้าสู่ระบบ รับ JWT
      operationId: login
      description: |
        Gateway ส่งต่อไปที่ `POST http://localhost:4003/auth/login` ของ auth-service
        นำ `data.token` ไปใส่ header `Authorization: Bearer <token>` ของคำขอเพิ่ม/แก้ไข/ลบ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: ส่งข้อมูลไม่ครบหรือไม่ใช่ข้อความ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: MISSING_FIELDS, message: กรุณาระบุ username และ password ให้ครบถ้วน }
        "401":
          description: username หรือ password ไม่ถูกต้อง (ตอบเหมือนกันทั้ง 2 กรณี)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: INVALID_CREDENTIALS, message: username หรือ password ไม่ถูกต้อง }
        "429":
          $ref: "#/components/responses/TooManyAuthAttempts"
        "503":
          description: auth-service ไม่พร้อม หรือยังไม่ได้ตั้งค่า JWT_SECRET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unavailable:
                  value:
                    error: { code: SERVICE_UNAVAILABLE, message: auth-service ไม่พร้อมใช้งานในขณะนี้ }
                notConfigured:
                  value:
                    error: { code: AUTH_NOT_CONFIGURED, message: ระบบยังไม่ได้ตั้งค่า JWT_SECRET }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: ข้อมูลผู้ใช้ที่เข้าสู่ระบบอยู่
      operationId: getCurrentUser
      description: Gateway ตรวจ token ก่อน แล้วส่งต่อพร้อม header Authorization ไปที่ `GET http://localhost:4003/auth/me`
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/boardgames:
    get:
      tags: [Boardgames]
      summary: ดึงรายการบอร์ดเกม (กรอง แบ่งหน้า เรียงลำดับ)
      operationId: listBoardgames
      description: |
        คืนรายการบอร์ดเกมพร้อมชื่อหมวดหมู่ (คั่นด้วยจุลภาค) รองรับการกรองตามหมวดหมู่ การแบ่งหน้า และการเรียงลำดับ

        - ไม่ส่ง `page`/`limit` = หน้า 1 หน้าละ 20 รายการ (สูงสุด 100) ดูจำนวนทั้งหมดได้ที่ `pagination`
        - ขอหน้าที่เกินจำนวนจริงจะได้ `data` เป็นอาร์เรย์ว่าง (ไม่ใช่ error)
        - ค่าที่เรียงซ้ำกันจะเรียงตาม `id` เป็นลำดับรอง ผลแต่ละหน้าจึงคงที่

        - ถ้าส่งทั้ง `category` และ `category_id` จะใช้ `category` เท่านั้น
        - เมื่อกรองตามหมวดหมู่ ฟิลด์ `categories` ของแต่ละเกมจะแสดงเฉพาะหมวดหมู่ที่ตรงกับตัวกรอง
      parameters:
        - name: category
          in: query
          required: false
          description: ชื่อหมวดหมู่ (ไม่สนใจตัวพิมพ์เล็กใหญ่)
          schema:
            type: string
            example: strategy
        - name: category_id
          in: query
          required: false
          description: ID ของหมวดหมู่
          schema:
            type: integer
            example: 1
        - name: page
          in: query
          required: false
          description: หน้าที่ต้องการ (เริ่มที่ 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: จำนวนรายการต่อหน้า
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: ฟิลด์ที่ใช้เรียง
          schema:
            type: string
            enum: [id, name, minPlayers, maxPlayers, createdAt]
            default: id
        - name: order
          in: query
          required: false
          description: ทิศทางการเรียง (ไม่สนตัวพิมพ์เล็กใหญ่)
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: สำเร็จ (ถ้าไม่พบข้อมูลที่ตรงเงื่อนไข จะได้ `data` เป็นอาร์เรย์ว่าง)
          headers:
            X-Cache:
              $ref: "#/components/headers/XCache"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Boardgame"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: query parameter ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidCategoryId:
                  summary: category_id ไม่ใช่จำนวนเต็มบวก
                  value:
                    error:
                      code: INVALID_ID
                      message: category_id ต้องเป็นตัวเลขจำนวนเต็มบวก
                invalidQuery:
                  summary: ส่ง category ซ้ำหลายค่า
                  value:
                    error:
                      code: INVALID_QUERY
                      message: category ต้องเป็นข้อความและระบุได้เพียงค่าเดียว
                invalidLimit:
                  summary: limit เกิน 100 หรือไม่ใช่จำนวนเต็มบวก
                  value:
                    error:
                      code: INVALID_QUERY
                      message: limit ต้องเป็นตัวเลขจำนวนเต็มระหว่าง 1 ถึง 100
                invalidSort:
                  summary: sort ไม่อยู่ในรายการที่อนุญาต
                  value:
                    error:
                      code: INVALID_QUERY
                      message: sort ต้องเป็นหนึ่งใน id, name, minPlayers, maxPlayers, createdAt
                invalidOrder:
                  summary: order ไม่ใช่ asc/desc
                  value:
                    error:
                      code: INVALID_QUERY
                      message: order ต้องเป็น asc หรือ desc
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    post:
      tags: [Boardgames]
      summary: เพิ่มบอร์ดเกมใหม่
      operationId: createBoardgame
      security:
        - bearerAuth: []
      description: |
        เมื่อเพิ่มสำเร็จ boardgame-service จะเรียก notification-service ให้ส่งแจ้งเตือนไปที่ Discord (API ภายนอก)
        โดยมี timeout, retry (ลองใหม่เมื่อ network error / timeout / 5xx) และ fallback

        ถ้าแจ้งเตือนไม่สำเร็จ ระบบยังตอบ 201 ตามปกติ โดยฟิลด์ `notification.sent` จะเป็น `false`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardgameInput"
      responses:
        "201":
          description: เพิ่มบอร์ดเกมสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: เพิ่มบอร์ดเกมสำเร็จ
                  data:
                    $ref: "#/components/schemas/BoardgameBase"
                  notification:
                    $ref: "#/components/schemas/Notification"
        "400":
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  summary: ส่งข้อมูลไม่ครบ
                  value:
                    error:
                      code: MISSING_FIELDS
                      message: กรุณาระบุ name, minPlayers และ maxPlayers ให้ครบถ้วน
                invalidName:
                  summary: name ว่าง ไม่ใช่ข้อความ หรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                invalidPlayers:
                  summary: จำนวนผู้เล่นไม่ใช่จำนวนเต็ม
                  value:
                    error:
                      code: INVALID_PLAYERS
                      message: minPlayers และ maxPlayers ต้องเป็นตัวเลขจำนวนเต็ม
                invalidPlayerRange:
                  summary: ช่วงจำนวนผู้เล่นไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_PLAYER_RANGE
                      message: จำนวนผู้เล่นต้องอยู่ระหว่าง 1 ถึง 2147483647 และ maxPlayers ต้องมากกว่าหรือเท่ากับ minPlayers
                malformedJson:
                  $ref: "#/components/examples/MalformedJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/DuplicateName"
        "413":
