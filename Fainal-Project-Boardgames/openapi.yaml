        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    put:
      tags: [Boardgames]
      summary: แก้ไขข้อมูลบอร์ดเกมทั้งระเบียน
      operationId: replaceBoardgame
      security:
        - bearerAuth: []
      description: ต้องส่งครบทุกฟิลด์ (`name`, `minPlayers`, `maxPlayers`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardgameInput"
      responses:
        "200":
          description: แก้ไขสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลบอร์ดเกมสำเร็จ
                  data:
                    $ref: "#/components/schemas/BoardgameBase"
        "400":
          description: id หรือข้อมูลที่ส่งมาไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: id ไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_ID
                      message: id ต้องเป็นตัวเลขจำนวนเต็มบวก
                missingFields:
                  summary: ส่งข้อมูลไม่ครบ
                  value:
                    error:
                      code: MISSING_FIELDS
                      message: กรุณาระบุ name, minPlayers และ maxPlayers ให้ครบถ้วน
                invalidName:
                  summary: name ว่าง ไม่ใช่ข้อความ หรือยาวเกิน 100 ตัวอักษร
                  value:
                    error:
                      code: INVALID_NAME
                      message: name ต้องเป็นข้อความที่ไม่ว่างเปล่าและยาวไม่เกิน 100 ตัวอักษร
                invalidPlayers:
                  summary: จำนวนผู้เล่นไม่ใช่จำนวนเต็ม
                  value:
                    error:
                      code: INVALID_PLAYERS
                      message: minPlayers และ maxPlayers ต้องเป็นตัวเลขจำนวนเต็ม
                invalidPlayerRange:
                  summary: ช่วงจำนวนผู้เล่นไม่ถูกต้อง
                  value:
                    error:
                      code: INVALID_PLAYER_RANGE
                      message: จำนวนผู้เล่นต้องอยู่ระหว่าง 1 ถึง 2147483647 และ maxPlayers ต้องมากกว่าหรือเท่ากับ minPlayers
